name: weekly-cwv

on:
  schedule:
    # Monday 02:00 UTC. The weekly data commit also counts as repo activity,
    # which is what stops GitHub disabling this schedule after 60 days idle.
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-cwv
  cancel-in-progress: false

jobs:
  # Deliberately one job. Commits pushed with GITHUB_TOKEN do not trigger other
  # workflows, so a separate on-push deploy would never fire.
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # The runner image ships Chrome's dependencies, but a missing shared
      # library would only surface as a 2am failure, so make it explicit.
      - name: Install Chrome system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      # continue-on-error so a partial week still gets committed, uploaded and
      # published. The job is failed explicitly at the end instead.
      - name: Run Lighthouse scan
        id: scan
        continue-on-error: true
        run: pnpm run scan

      - name: Fetch CrUX field data
        id: crux
        continue-on-error: true
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: pnpm run crux

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "no data changes to commit"
          else
            git commit -m "data: ${{ steps.scan.outputs.week || 'weekly' }} scan"
            git push
          fi

      # Full Lighthouse reports are 0.5-2 MB each; 30 a week would reach a
      # gigabyte inside a year, so git holds only extracted metrics and the
      # reports live here for 90 days.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ steps.scan.outputs.week || github.run_id }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn

      - name: Build dashboard
        run: pnpm run build

      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dist/
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tiket-accom-cwv --branch=main

      - name: Report scan failures
        if: steps.scan.outcome == 'failure' || steps.crux.outcome == 'failure'
        run: |
          echo "scan: ${{ steps.scan.outcome }}, crux: ${{ steps.crux.outcome }}"
          echo "Data and dashboard were still published; see the step logs above."
          exit 1
