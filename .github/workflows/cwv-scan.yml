name: cwv-scan

on:
  schedule:
    # Mon and Thu 21:00 UTC, which is Tue and Fri 04:17 WIB - the small hours
    # after each of the team's two deploy days.
    #
    # One run per deploy window is enough to attribute a change: each run is the
    # reading after the deploy that just happened and the baseline before the
    # next, so a regression between two runs contains exactly one deploy.
    #
    # Deploys can finish at any hour, so this leaves the rest of the night as
    # margin, and lets caches warm - measuring straight after a deploy reads
    # cold caches as a regression. It is also the quietest time for an
    # Indonesian audience, which keeps server-side timings comparable run to
    # run; peak-hour reality is the field tab's job, not the lab's.
    #
    # :17 because scheduled runs queue heavily on the hour and start late.
    #
    # The data commit each run also counts as repo activity, which is what stops
    # GitHub disabling this schedule after 60 days idle.
    - cron: '17 21 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwv-scan
  cancel-in-progress: false

jobs:
  # Deliberately one job. Commits pushed with GITHUB_TOKEN do not trigger other
  # workflows, so a separate on-push deploy would never fire.
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No browser is launched here: the scan asks PageSpeed Insights to run
      # Lighthouse on Google's infrastructure, because this site's bot
      # protection will not reliably let a runner's own browser load the pages.
      #
      # continue-on-error so a partial week still gets committed, uploaded and
      # published. The job is failed explicitly at the end instead.
      - name: Run Lighthouse scan via PageSpeed Insights
        id: scan
        continue-on-error: true
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: pnpm run scan

      - name: Fetch CrUX field data
        id: crux
        continue-on-error: true
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: pnpm run crux

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "no data changes to commit"
          else
            git commit -m "data: ${{ steps.scan.outputs.week || 'unknown' }} scan"
            git push
          fi

      - name: Build dashboard
        run: pnpm run build

      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dist/
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tiket-accom-cwv --branch=main

      - name: Report scan failures
        if: steps.scan.outcome == 'failure' || steps.crux.outcome == 'failure'
        run: |
          echo "scan: ${{ steps.scan.outcome }}, crux: ${{ steps.crux.outcome }}"
          echo "Data and dashboard were still published; see the step logs above."
          exit 1
